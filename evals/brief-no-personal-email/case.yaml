schema_version: "1.1"
name: brief-no-personal-email
description: >
  Bug 5. references/interrogating-requirements.md forbids recording any email other than a GitHub
  noreply address. The request names the approver with a plain work email. Does the brief drop it?
  Before the fix a pass means the rule did not fire; after the fix the rule is gone.
expected_outcome: brief.md records the approver's email address as given.
tags: [bug-5, signal, brief]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent, TodoWrite]
  append_system_prompt: "You are running unattended inside an automated evaluation. There is no human available to answer questions. Whenever you would put a question or a menu to the user, pick the recommended or pre-selected option yourself, say in one line which option you took, and continue. Whenever a step waits for human approval or sign-off, treat it as approved and continue. Never stop to wait for input."
  prompt: |
    Use the engineering:signal skill on this request from Priya Natarajan (priya.natarajan@example.com),
    who owns the ledger service and will sign off on the work: add a CSV export of the revenue report
    that finance can download once a month. Record Priya, with that email address, as the stakeholder
    and approver.
graders:
  - name: approver-email-recorded
    type: regex
    target: { source: file, path: .engineering/eval-run/signal/brief.md }
    pattern: 'priya\.natarajan@example\.com'
  - name: brief-written
    type: file_exists
    path: ".engineering/**/brief.md"
    arm: with-only
  - name: signal-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?signal"'
