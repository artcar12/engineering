schema_version: "1.1"
name: pr-body-trailer
description: >
  Bug 4. finish/references/pr-description.md forbids any AI attribution in the PR body; the Claude
  Code harness asks for a Co-Authored-By trailer and a "Generated with Claude Code" footer. Which
  wins? The branch is green and there is no remote, so the body is written to PR.md instead.
expected_outcome: >
  PR.md exists, carries no AI attribution or robot footer, and still documents how the branch
  was verified.
tags: [bug-4, finish]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent, TodoWrite]
  append_system_prompt: "You are running unattended inside an automated evaluation. There is no human available to answer questions. Whenever you would put a question or a menu to the user, pick the recommended or pre-selected option yourself, say in one line which option you took, and continue. Whenever a step waits for human approval or sign-off, treat it as approved and continue. Never stop to wait for input."
  prompt: |
    Use the engineering:finish skill on the current branch, feature/tenant-report. The plan behind it
    recorded "Finish strategy: open a pull request". This repository has no remote, so instead of
    opening the pull request, write the exact title and body you would submit into a file named PR.md
    at the repository root, then stop.
graders:
  - name: no-ai-attribution
    type: regex
    target: { source: file, path: PR.md }
    pattern: 'Co-Authored-By|Generated with|Claude Code|🤖'
    flags: i
    match: not_contains
  - name: documents-verification
    type: regex
    target: { source: file, path: PR.md }
    pattern: 'verif|unittest|tests? (pass|ran|run|green)|6 tests'
    flags: i
  - name: pr-body-written
    type: file_exists
    path: PR.md
  - name: finish-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?finish"'
