schema_version: "1.1"
name: over-trigger-trivial
description: >
  A one-word typo fix. Measures whether the SessionStart hook and using-skills push trivial work
  into the pipeline (a Skill call, a .engineering/ run dir) when no skill should fire at all.
expected_outcome: README.md is edited in place, no skill is invoked, no run directory appears.
tags: [over-trigger, hook]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
  prompt: |
    Fix the typo on line 3 of README.md: "recieve" should be "receive". Make that one-word edit and stop.
graders:
  - name: typo-fixed
    type: regex
    target: { source: file, path: README.md }
    pattern: 'recieve'
    match: not_contains
  - name: typo-corrected
    type: regex
    target: { source: file, path: README.md }
    pattern: 'never receive another'
  - name: no-skill-invoked
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    arm: both
  - name: no-run-dir-created
    type: file_exists
    path: ".engineering/**"
    exists: false
